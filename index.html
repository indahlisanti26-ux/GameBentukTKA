<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dino Laper - Mengenal Bentuk & Warna</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Fredoka', 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #a8e6cf 0%, #dbedc6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: manipulation;
        }

        #game-container {
            width: 95vw;
            max-width: 900px;
            height: 90vh;
            max-height: 650px;
            background: #ffffff;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: 8px solid #56ab2f;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            padding: 20px;
            text-align: center;
            animation: fadeIn 0.4s ease-in-out;
        }

        .screen.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            font-size: 2.5rem;
            color: #2b580c;
            text-shadow: 2px 2px 0px #ffffff;
            margin-bottom: 10px;
        }

        h2 { font-size: 1.8rem; color: #438a5e; margin-bottom: 15px; }

        .btn {
            background: #ff9900;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #cc7a00, 0 8px 15px rgba(0,0,0,0.15);
            transition: all 0.1s ease;
            margin: 8px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #cc7a00; }
        .btn-green { background: #56ab2f; box-shadow: 0 6px 0 #3a751f; }
        .btn-green:active { box-shadow: 0 2px 0 #3a751f; }
        .btn-blue { background: #4a90e2; box-shadow: 0 6px 0 #2a5d9b; }

        .form-group { margin: 15px 0; width: 85%; max-width: 320px; }
        .form-group label { display: block; font-size: 1.2rem; color: #2b580c; margin-bottom: 5px; font-weight: bold; }
        .form-group input {
            width: 100%; padding: 12px 20px; font-size: 1.3rem;
            border: 4px solid #a8e6cf; border-radius: 20px; text-align: center; outline: none;
        }

        .header-bar {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; background-color: #dbedc6; border-bottom: 4px solid #a8e6cf;
        }

        /* AREA DINO & MAKANAN */
        .dino-stage {
            flex: 1; width: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: space-around; padding: 10px;
        }

        .dino-avatar {
            font-size: 6rem; transition: transform 0.2s; cursor: pointer;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.15));
        }

        .dino-avatar.eating { transform: scale(1.3) rotate(-5deg); }

        .hunger-bar-container {
            width: 80%; max-width: 300px; height: 22px; background: #e0e0e0;
            border-radius: 15px; border: 3px solid #56ab2f; overflow: hidden; margin: 5px 0;
        }

        .hunger-bar-fill {
            height: 100%; width: 0%; background: linear-gradient(90deg, #ff9900, #56ab2f);
            transition: width 0.3s ease;
        }

        .food-grid {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; width: 100%;
        }

        .food-item {
            width: 85px; height: 85px; border-radius: 20px; background: #ffffff;
            border: 4px solid #a8e6cf; box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            cursor: pointer; display: flex; flex-direction: column; align-items: center;
            justify-content: center; font-size: 2.5rem; transition: transform 0.1s;
        }

        .food-item:active { transform: scale(0.85); }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .dino-avatar { font-size: 4.5rem; }
            .food-item { width: 70px; height: 70px; font-size: 2rem; }
        }
    </style>
</head>
<body>

<div id="game-container">

    <!-- 1. LOGIN -->
    <div id="screen-login" class="screen active">
        <h1>🦖 DINO LAPER 🥩</h1>
        <p style="color: #438a5e; margin-bottom: 15px; font-weight: bold;">Game Mengenal Bentuk & Warna PAUD</p>
        <div class="form-group">
            <label for="player-name">Nama Pemain:</label>
            <input type="text" id="player-name" placeholder="Ketik namamu..." maxlength="12">
        </div>
        <div class="form-group">
            <label for="player-class">Kelas:</label>
            <input type="text" id="player-class" placeholder="Contoh: TK A" maxlength="10">
        </div>
        <button class="btn btn-green" onclick="submitLogin()">Beri Makan Dino! 🚀</button>
    </div>

    <!-- 2. MENU LEVEL -->
    <div id="screen-menu" class="screen">
        <h2 id="welcome-text">Halo Teman Dino!</h2>
        <p style="color: #2b580c; margin-bottom: 15px; font-weight: bold;">Pilih Menu Makanan Dino:</p>
        <div style="display: flex; flex-direction: column; width: 100%; max-width: 350px;">
            <button class="btn btn-green" onclick="startGame(1)">🌱 Level 1: Bentuk Dasar (2 Pilihan)</button>
            <button class="btn" onclick="startGame(2)">⭐ Level 2: Warna & Bentuk (3 Pilihan)</button>
            <button class="btn btn-blue" onclick="startGame(3)">👑 Level 3: Makanan Spesial (4 Pilihan)</button>
        </div>
        <button class="btn btn-blue" onclick="showScreen('screen-login')" style="margin-top: 15px; font-size: 0.9rem;">👤 Ganti Profil</button>
    </div>

    <!-- 3. GAMEPLAY -->
    <div id="screen-game" class="screen" style="justify-content: flex-start; padding: 0;">
        <div class="header-bar">
            <div id="game-player-info" style="font-weight: bold; color: #2b580c;">Pemain</div>
            <button class="btn btn-blue" onclick="goToMenu()" style="font-size: 0.8rem; padding: 6px 12px; margin: 0;">🏠 Menu</button>
        </div>

        <div class="dino-stage">
            <div id="instruction-text" style="font-size: 1.3rem; font-weight: bold; color: #2b580c;">Beri Dino Makanan!</div>
            
            <div id="dino" class="dino-avatar" onclick="speakTarget()">🦖</div>

            <div>
                <span style="font-size: 0.9rem; font-weight: bold; color: #438a5e;">Tingkat Kenyang Dino:</span>
                <div class="hunger-bar-container">
                    <div id="hunger-bar" class="hunger-bar-fill"></div>
                </div>
            </div>

            <div id="food-container" class="food-grid"></div>
        </div>
    </div>

    <!-- 4. HASIL -->
    <div id="screen-result" class="screen">
        <h1 style="font-size: 2.5rem;">🎉 DINO KENYANG! 🎉</h1>
        <div style="font-size: 5rem; margin: 10px 0;">🦕</div>
        <h2>Dino Sangat Senang!</h2>
        <p id="result-detail" style="font-size: 1.1rem; color: #2b580c; font-weight: bold; margin-bottom: 15px;"></p>
        <div>
            <button class="btn btn-green" onclick="replayGame()">🔄 Main Lagi</button>
            <button class="btn" onclick="showScreen('screen-menu')">🏁 Pilih Level</button>
        </div>
    </div>

</div>

<script>
    const SHAPES_DATA = [
        { name: "Bintang", icon: "⭐" },
        { name: "Hati", icon: "❤️" },
        { name: "Lingkaran", icon: "🟡" },
        { name: "Kotak", icon: "🟦" },
        { name: "Segitiga", icon: "🔺" },
        { name: "Apel", icon: "🍎" },
        { name: "Pisang", icon: "🍌" }
    ];

    let playerName = "", playerClass = "", currentLevel = 1, hungerScore = 0, targetItem = null;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);

        if (type === 'eat') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'win') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'id-ID'; u.rate = 0.85;
            window.speechSynthesis.speak(u);
        }
    }

    function speakTarget() { if (targetItem) speakText(`Beri Dino makanan bentuk ${targetItem.name}`); }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function submitLogin() {
        playerName = document.getElementById('player-name').value.trim();
        playerClass = document.getElementById('player-class').value.trim() || "PAUD";
        if (!playerName) { alert("Isi namamu dulu ya!"); return; }
        document.getElementById('welcome-text').innerText = `Halo, ${playerName}! 🦖`;
        showScreen('screen-menu');
        speakText(`Halo ${playerName}! Pilih makanan untuk Dino.`);
    }

    function goToMenu() { showScreen('screen-menu'); }

    function startGame(level) {
        currentLevel = level; hungerScore = 0;
        document.getElementById('game-player-info').innerText = `👤 ${playerName} (${playerClass}) - Lv.${level}`;
        document.getElementById('hunger-bar').style.width = "0%";
        showScreen('screen-game');
        nextTurn();
    }

    function nextTurn() {
        const container = document.getElementById('food-container');
        container.innerHTML = "";
        let count = currentLevel === 1 ? 2 : (currentLevel === 2 ? 3 : 4);

        let shuffled = [...SHAPES_DATA].sort(() => 0.5 - Math.random());
        let choices = shuffled.slice(0, count);
        targetItem = choices[Math.floor(Math.random() * choices.length)];

        document.getElementById('instruction-text').innerText = `Suap Dino dengan: ${targetItem.name} ${targetItem.icon}`;
        speakTarget();

        choices.forEach(item => {
            const div = document.createElement('div');
            div.className = 'food-item';
            div.innerHTML = `<span>${item.icon}</span><span style="font-size:0.8rem; font-weight:bold; color:#2b580c;">${item.name}</span>`;
            div.onclick = () => feedDino(item);
            container.appendChild(div);
        });
    }

    function feedDino(item) {
        const dino = document.getElementById('dino');
        if (item.name === targetItem.name) {
            playSound('eat');
            dino.classList.add('eating');
            dino.innerText = "😋";
            hungerScore += 20;
            document.getElementById('hunger-bar').style.width = hungerScore + "%";

            setTimeout(() => {
                dino.classList.remove('eating');
                dino.innerText = "🦖";
                if (hungerScore >= 100) {
                    playSound('win');
                    document.getElementById('result-detail').innerText = `Kerja bagus ${playerName}! Kamu berhasil membuat Dino kenyang!`;
                    speakText(`Hore! Terima kasih ${playerName}, Dino sudah kenyang!`);
                    showScreen('screen-result');
                } else {
                    nextTurn();
                }
            }, 400);
        } else {
            playSound('wrong');
            speakText("Ups, bukan yang itu!");
            dino.innerText = "😮‍💨";
            setTimeout(() => dino.innerText = "🦖", 400);
        }
    }

    function replayGame() { startGame(currentLevel); }
</script>
</body>
</html>
